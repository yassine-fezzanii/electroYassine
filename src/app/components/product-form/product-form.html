<div class="container">
    <div class="glass-card form-container">
        <h2 class="gradient-text" style="margin-bottom: 2rem;">{{ isEdit ? 'Modifier le Produit' : 'Nouveau Produit' }}</h2>

        <form (ngSubmit)="onSubmit()" #productForm="ngForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Nom du Produit</label>
                    <input type="text" name="name" [(ngModel)]="product.name" class="input-field" required>
                </div>

                <div class="form-group full">
                    <label>Description</label>
                    <textarea name="description" [(ngModel)]="product.description" class="input-field" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>Prix (€)</label>
                    <input type="number" name="price" [(ngModel)]="product.price" class="input-field" required>
                </div>

                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" name="stock" [(ngModel)]="product.stock" class="input-field" required>
                </div>

                <div class="form-group">
                    <label>Marque</label>
                    <input type="text" name="brand" [(ngModel)]="product.brand" class="input-field">
                </div>

                <div class="form-group">
                    <label>Catégorie</label>
                    <select name="categoryId" [(ngModel)]="product.categoryId" class="input-field" style="background: #1e293b;">
                        <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>URL de l'image</label>
                    <input type="text" name="imageUrl" [(ngModel)]="product.imageUrl" class="input-field" placeholder="https://...">
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="submit" class="btn-primary" [disabled]="!productForm.valid">
                    {{ isEdit ? 'Enregistrer les modifications' : 'Créer le produit' }}
                </button>
                <button type="button" (click)="router.navigate(['/products'])" class="btn-outline">Annuler</button>
            </div>
        </form>
    </div>
</div>
