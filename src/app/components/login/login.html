<div class="login-container">
    <div class="glass-card login-card">
        <h2 class="gradient-text" style="margin-bottom: 2rem; font-size: 2rem;">Connexion</h2>
        
        <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" name="username" [(ngModel)]="credentials.username" class="input-field" required>
            </div>
            
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" [(ngModel)]="credentials.password" class="input-field" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
                Se connecter
            </button>
        </form>
        
        <p style="margin-top: 1.5rem; text-align: center; color: var(--text-muted);">
            Admin: admin / admin123 <br>
            User: user / user123
        </p>
    </div>
</div>
